# Jellyscope
#
#   docker compose up -d        Start in background
#   docker compose logs -f      Follow container logs
#   docker compose down         Stop container (data persists in ./data)
#
# Generate a SECRET_KEY before deploying:
#   python3 -c "import secrets; print(secrets.token_hex(32))"

services:
  jellyscope:
    build:
      context: .
      args:
        # 0 = without ffmpeg (~250 MB smaller image). Media info relies only on Jellyfin API (no ffprobe).
        FFPROBE: "${FFPROBE:-1}"
        # 0 = without pg_dump (~30 MB). Only affects PostgreSQL backups; SQLite is unaffected.
        PGDUMP: "${PGDUMP:-1}"
    container_name: jellyscope
    restart: unless-stopped

    ports:
      # 0.0.0.0 allows access from your local network (LAN).
      # Set BIND=127.0.0.1 in environment variables if routing strictly through a local reverse proxy.
      - "${BIND:-0.0.0.0}:${PORT:-8097}:${PORT:-8097}"

    environment:
      # Must listen on 0.0.0.0 inside the container so Docker port mapping can reach it.
      HOST: "0.0.0.0"
      PORT: "${PORT:-8097}"

      # REQUIRED - Signs login session cookies. Changing this logs out all users.
      # Set this in Arcane's Environment / .env panel before deploying.
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in your environment variables}"

      # 1 = Demo mode (read-only public preview; nothing can be saved). Keep at 0 for normal use.
      JELLYSCOPE_DEMO: "${JELLYSCOPE_DEMO:-0}"

      # Initial Jellyfin connection settings (stored in the database after first boot).
      JELLYFIN_URL: "${JELLYFIN_URL:-http://jellyfin:8096}"
      JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-}"

      # If behind an HTTPS reverse proxy, set SECURE_COOKIES=1 and FORWARDED_ALLOW_IPS=<proxy_ip>
      # so Jellyscope logs real client IPs instead of the proxy IP.
      SECURE_COOKIES: "${SECURE_COOKIES:-0}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-}"

      # Sets timezone for charts and playback history.
      TZ: "${TZ:-Asia/Kolkata}"

    volumes:
      # Stores SQLite database, logs, image cache, and backups.
      # Note: Set backup path inside /app/data/backups in the UI so backups persist across rebuilds.
      - "${DATA_DIR:-./data}:/app/data"

      # Optional: Mount your media library read-only (:ro) if using ffprobe for deep media inspection.
      # Map the Jellyfin path to /media inside Jellyscope under Settings -> Data Collection.
      - "${MEDIA_DIR}:${MEDIA_MOUNT}"

    security_opt:
      - no-new-privileges:true
